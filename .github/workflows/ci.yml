name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      LIBTORCH_VERSION: 2.7.0
      LIBTORCH: ${{ runner.temp }}/libtorch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache clang-tidy unzip

      - name: Cache libtorch
        id: cache-libtorch
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBTORCH }}
          key: libtorch-linux-cpu-${{ env.LIBTORCH_VERSION }}

      - name: Download CPU libtorch
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        run: node scripts/download-libtorch.mjs --backend=cpu --version=${{ env.LIBTORCH_VERSION }} --dest=${{ env.LIBTORCH }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addon, codegen, and TypeScript
        run: npm run build

      - name: Run CPU test suite
        run: npm test

      - name: Run clang-tidy
        run: npm run lint:cpp
