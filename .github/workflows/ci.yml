name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_key: linux-x64
            backend: cpu
            run_lint: true
          - os: macos-latest
            platform_key: darwin-arm64
            backend: mps
            run_lint: false
          - os: windows-latest
            platform_key: win32-x64
            backend: cpu
            run_lint: false
    runs-on: ${{ matrix.os }}
    env:
      LIBTORCH_VERSION: 2.7.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure LIBTORCH path
        run: node -e "const fs=require('node:fs'),p=require('node:path');const dir=p.join(process.env.RUNNER_TEMP,'libtorch');fs.appendFileSync(process.env.GITHUB_ENV,'LIBTORCH='+dir+'\n');"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache clang-tidy unzip

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja ccache libomp

      - name: Cache libtorch
        id: cache-libtorch
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libtorch
          key: libtorch-${{ matrix.platform_key }}-${{ matrix.backend }}-${{ env.LIBTORCH_VERSION }}

      - name: Download libtorch
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        run: node scripts/download-libtorch.mjs --backend=${{ matrix.backend }} --version=${{ env.LIBTORCH_VERSION }} --dest=${{ env.LIBTORCH }}

      - name: Add libtorch DLLs to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:LIBTORCH\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addon, codegen, and TypeScript
        run: npm run build

      - name: Run CPU test suite
        run: npm test

      - name: Run clang-tidy
        if: matrix.run_lint
        run: npm run lint:cpp

      - name: Verify npm pack manifest
        if: runner.os == 'Linux'
        run: npm pack --dry-run
